name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy signed images to the production environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image-prefix: ${{ steps.image.outputs.prefix }}
    steps:
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [prepare, verify]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: .
            dockerfile: Dockerfile
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: linux/amd64
          tags: local/ghostinc-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Block critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/ghostinc-${{ matrix.name }}:${{ github.sha }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: local/ghostinc-${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ runner.temp }}/${{ matrix.name }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
      - name: Publish SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.name }}.spdx.json
          retention-days: 30
      - name: Publish multi-architecture image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.name }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign image with GitHub OIDC
        env:
          IMAGE: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.name }}@${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Verify published signature
        env:
          IMAGE: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.name }}@${{ steps.publish.outputs.digest }}
        run: >-
          cosign verify
          --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          "$IMAGE"
      - name: Record immutable digest
        run: printf '%s' '${{ steps.publish.outputs.digest }}' > '${{ runner.temp }}/${{ matrix.name }}.digest'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.digest
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Resolve and verify immutable images
        id: images
        run: |
          frontend="${{ needs.prepare.outputs.image-prefix }}/frontend@$(<digests/frontend.digest)"
          backend="${{ needs.prepare.outputs.image-prefix }}/backend@$(<digests/backend.digest)"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$frontend"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$backend"
          printf 'frontend=%s\n' "$frontend" >> "$GITHUB_OUTPUT"
          printf 'backend=%s\n' "$backend" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' '${{ secrets.OCI_SSH_KEY }}' > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          printf '%s\n' '${{ secrets.OCI_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Upload deployment manifests
        run: |
          ssh -i ~/.ssh/oci_key '${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}' "mkdir -p '${{ secrets.OCI_DEPLOY_PATH }}/deploy'"
          scp -i ~/.ssh/oci_key compose.production.yaml '${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ secrets.OCI_DEPLOY_PATH }}/compose.production.yaml'
          scp -i ~/.ssh/oci_key deploy/Caddyfile '${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ secrets.OCI_DEPLOY_PATH }}/deploy/Caddyfile'
      - name: Deploy on OCI
        run: |
          ssh -i ~/.ssh/oci_key '${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}' \
            "cd '${{ secrets.OCI_DEPLOY_PATH }}' && FRONTEND_IMAGE='${{ steps.images.outputs.frontend }}' BACKEND_IMAGE='${{ steps.images.outputs.backend }}' docker compose --env-file .env.production -f compose.production.yaml pull && FRONTEND_IMAGE='${{ steps.images.outputs.frontend }}' BACKEND_IMAGE='${{ steps.images.outputs.backend }}' docker compose --env-file .env.production -f compose.production.yaml up -d --remove-orphans"
