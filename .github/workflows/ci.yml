name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.96.0
          extra_args: --only-verified

  env-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject forbidden .env* files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)(\.env|\.env\.[^.]+)$' | grep -v '\.env\.example$' || true)
          if [ -n "$forbidden" ]; then
            echo "Se detectaron archivos .env* permitidos solo como .env.example:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: ghostinc_test
          POSTGRES_USER: ghostinc
          POSTGRES_PASSWORD: ghostinc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostinc -d ghostinc_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ghostinc:ghostinc_test@localhost:5432/ghostinc_test
      API_KEY_PEPPER: ci-only-pepper-with-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [secret-scan, frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: docker compose -f compose.yaml config
      - run: docker compose -f compose.yaml build
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghostinc-frontend:latest
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghostinc-backend:latest
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
