name: ghostinc

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,nosuid,nodev
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: https://${DOMAIN}
      PJUD_API_BASE_URL: ${PJUD_API_BASE_URL}
      PJUD_API_KEY: ${PJUD_API_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_BASE_URL: https://${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
      SESSION_INACTIVITY_SECONDS: ${SESSION_INACTIVITY_SECONDS:-1800}
      SESSION_ROTATION_SECONDS: ${SESSION_ROTATION_SECONDS:-900}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      RECOVERY_CODE_PEPPER: ${RECOVERY_CODE_PEPPER}
      ADMIN_MFA_REAUTH_SECONDS: ${ADMIN_MFA_REAUTH_SECONDS:-1800}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_BASE_URL: https://${DOMAIN}
      SESSION_ABSOLUTE_SECONDS: ${SESSION_ABSOLUTE_SECONDS:-28800}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,nosuid,nodev
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256

  proxy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
